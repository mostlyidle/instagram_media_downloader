[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-media-downloader"
version = "0.1.0"
description = "Download Instagram media you are allowed to access."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.50.0",
    "yt-dlp>=2026.1.1",
]

[project.scripts]
ig-scraper = "ig_media_downloader.__main__:main"

[tool.setuptools.packages.find]
include = ["ig_media_downloader*"]
